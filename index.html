<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Flame Assassin [Fixed]</title>
    <style>
        body {
            background-color: #1e1e26;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #game-container {
            max-width: 400px;
            margin: 0 auto;
            background: #1f1f2b;
            border: 2px solid #ff7200;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 15px rgba(255, 114, 0, 0.4);
        }
        h2 { color: #ff7200; font-size: 18px; margin-bottom: 5px; }
        .hud { font-size: 13px; color: #cccccc; margin: 8px 0; }
        .status { font-size: 13px; color: #00ff66; min-height: 40px; margin: 10px 0; font-weight: bold; background: #252536; padding: 8px; border-radius: 5px;}
        input[type="text"] {
            width: 85%;
            padding: 8px;
            margin: 8px 0;
            background: #2a2a3b;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
        }
        button {
            width: 90%;
            padding: 10px;
            margin: 6px 0;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }
        button:active { transform: scale(0.98); }
        .btn-login { background-color: #ff7200; }
        .btn-photo { background-color: #0066cc; }
        .action-box {
            background: #252536;
            border: 2px dashed #ff7200;
            padding: 20px;
            margin-top: 15px;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }
        .action-box:active { background: #33334d; }
    </style>
</head>
<body>

<div id="game-container">
    <h2>THE FLAME ASSASSIN</h2>
    <div class="hud" id="hud-id">ID: Loading... | Coins: 150 🪙</div>
    <div class="hud" id="hud-score">Score: 0 | Level: 1</div>
    
    <input type="text" id="username" placeholder="Enter Your Name">
    <br>
    <button class="btn-login" onclick="handleLogin()">1. Login ID</button>
    <button class="btn-photo" onclick="verifyPhoto()">2. Verify Photo ID</button>
    
    <div class="action-box" onclick="tapAction()">
        🎯 <b>TAP HERE TO ATTACK / PLAY</b>
    </div>
    
    <div class="status" id="status-msg">Status: Enter name & click Login to start!</div>
</div>

<script>
    let game = {
        gamerId: "Assassin_" + Math.floor(1000 + Math.random() * 9000),
        score: 0,
        level: 1,
        currency: 150,
        username: "",
        isLoggedIn: false,
        hasPhotoId: false
    };

    function updateHUD() {
        document.getElementById("hud-id").innerText = `ID: ${game.gamerId} | Coins: ${game.currency}🪙`;
        document.getElementById("hud-score").innerText = `Score: ${game.score} | Level: ${game.level}`;
    }

    function handleLogin() {
        let val = document.getElementById("username").value.trim();
        if (val !== "") {
            game.username = val;
            game.isLoggedIn = true;
            document.getElementById("status-msg").innerText = `Success! Logged in as ${val}. Now click Verify Photo ID.`;
        } else {
            document.getElementById("status-msg").innerText = `⚠️ Pehle box mein naam toh likho bhai!`;
        }
    }

    function verifyPhoto() {
        if (!game.isLoggedIn) {
            document.getElementById("status-msg").innerText = `⚠️ Pehle Login ID karo!`;
            return;
        }
        game.hasPhotoId = true;
        document.getElementById("status-msg").innerText = `🎉 Verified! Ab niche Target par tap karke khelo!`;
    }

    function tapAction() {
        if (!game.isLoggedIn || !game.hasPhotoId) {
            document.getElementById("status-msg").innerText = `⚠️ Pehle Login aur Verify karo!`;
            return;
        }
        game.score += 1;
        game.currency += 5;
        
        if (game.score % 5 === 0) {
            game.level += 1;
            document.getElementById("status-msg").innerText = `⚡ LEVEL UP! Level ${game.level} reached! Score: ${game.score}`;
        } else {
            document.getElementById("status-msg").innerText = `🔥 Attack Successful! Score: ${game.score}`;
        }
        updateHUD();
    }

    updateHUD();
</script>

</body>
</html>
