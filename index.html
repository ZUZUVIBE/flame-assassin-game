<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Flame Assassin - Multiplayer</title>
    <style>
        body {
            background-color: #121218;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            background: #1a1a24;
            border: 2px solid #ff5500;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(255, 85, 0, 0.4);
        }
        h2 { color: #ff5500; margin-bottom: 10px; }
        .box { background: #222230; padding: 12px; border-radius: 8px; margin: 10px 0; font-size: 14px; }
        input { width: 80%; padding: 10px; margin: 5px 0; background: #2a2a3b; border: 1px solid #444; color: #fff; border-radius: 6px; text-align: center; font-size: 16px; }
        button { width: 90%; padding: 12px; margin: 6px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 14px; transition: 0.2s; }
        button:active { transform: scale(0.97); }
        .btn-main { background-color: #ff5500; }
        .btn-room { background-color: #0088ff; }
        .btn-action { background-color: #00aa44; font-size: 16px; padding: 18px; margin-top: 15px; border: 2px dashed #fff; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔥 THE FLAME ASSASSIN 🔥</h2>
    <div class="box" id="user-info">ID: Connecting...</div>
    
    <div class="box">
        <b>🌐 Online Friends & Rooms</b><br>
        <input type="text" id="room-input" placeholder="Enter Room Code (e.g. 1234)">
        <button class="btn-room" onclick="joinRoom()">Join Friend's Room</button>
        <button class="btn-room" onclick="createRoom()" style="background-color: #9c27b0;">Create New Room</button>
    </div>

    <button class="btn-action" onclick="hitTarget()">🎯 TAP HERE TO ATTACK!</button>
    
    <div class="box" id="game-stats">
        Score: 0 | Coins: 100 🪙 | Room: Solo
    </div>
    <div id="log-msg" style="color: #00ff66; font-size: 13px; font-weight: bold; margin-top: 10px;">Status: Ready for action!</div>
</div>

<script>
    // Unique ID generation without annoying forms
    let myId = "Assassin_" + Math.floor(1000 + Math.random() * 9000);
    let score = 0;
    let coins = 100;
    let currentRoom = "Solo";

    document.getElementById("user-info").innerText = `My ID: ${myId}`;

    function updateDisplay() {
        document.getElementById("game-stats").innerText = `Score: ${score} | Coins: ${coins} 🪙 | Room: ${currentRoom}`;
    }

    function createRoom() {
        let code = Math.floor(100 + Math.random() * 900);
        currentRoom = "Room_" + code;
        document.getElementById("room-input").value = code;
        document.getElementById("log-msg").innerText = `✅ Room ${code} Created! Share code with friends.`;
        updateDisplay();
    }

    function joinRoom() {
        let val = document.getElementById("room-input").value.trim();
        if(val) {
            currentRoom = "Room_" + val;
            document.getElementById("log-msg").innerText = `🚀 Joined Room ${val} with friends successfully!`;
            updateDisplay();
        } else {
            document.getElementById("log-msg").innerText = `⚠️ Please enter a valid room code!`;
        }
    }

    function hitTarget() {
        score += 1;
        coins += 10;
        document.getElementById("log-msg").innerText = `🔥 Attack successful in ${currentRoom}! +10 Coins`;
        updateDisplay();
    }

    updateDisplay();
</script>

</body>
</html>
