<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Flame Assassin</title>

<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    background: #0b0b0f;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
.game-wrapper {
    width: 100%;
    max-width: 430px;
    background: #14141f;
    border: 2px solid #ff5500;
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 0 25px rgba(255,85,0,.3);
}
h1 { color: #ff5500; text-align: center; font-size: 24px; margin: 0 0 20px; }
.panel { background: #1c1c2b; border-radius: 10px; padding: 14px; margin-bottom: 15px; border: 1px solid #2a2a40; }
.stats-row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: bold; color: #ffcc00; margin-bottom: 8px; }
.status { text-align: center; color: #00ff66; font-size: 13px; margin-top: 8px; }
.btn { width: 100%; border: 0; border-radius: 10px; padding: 15px; margin-bottom: 12px; font-size: 16px; font-weight: bold; color: white; background: linear-gradient(135deg,#ff5500,#ff2200); cursor: pointer; }
.btn:active { transform: scale(.98); }
.secondary { background: #252538; border: 1px solid #00ff66; color: #00ff66; }
#console-log { background: #0d0d14; color: #00ff66; font-family: monospace; font-size: 12px; padding: 12px; border-radius: 8px; height: 90px; overflow-y: auto; border: 1px solid #1f1f2e; }
.hidden { display: none !important; }
.auth-box { text-align: center; }
input { width: 100%; padding: 13px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #33334a; background: #0d0d14; color: white; font-size: 15px; outline: none; }
input:focus { border-color: #ff5500; }
.small { color: #aaa; font-size: 12px; margin-bottom: 15px; }
</style>
</head>

<body>

<div class="game-wrapper">
    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="auth-box">
        <h1>🔥 FLAME ASSASSIN 🔥</h1>
        <p class="small">Create your player account to enter the game.</p>
        <input id="username" type="text" maxlength="20" placeholder="Enter username">
        <input id="password" type="password" placeholder="Enter password">
        <button class="btn" id="signup-btn">CREATE ACCOUNT</button>
        <button class="btn secondary" id="login-btn">LOGIN</button>
        <div id="auth-message" class="small"></div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="hidden">
        <h1>🔥 FLAME ASSASSIN 🔥</h1>
        <div class="panel">
            <div class="stats-row">
                <span id="player-name">Player</span>
                <span id="player-score">Score: 0</span>
            </div>
            <div class="stats-row">
                <span id="player-coins">Coins: 180 🪙</span>
                <span id="player-power">Power: Level 1</span>
            </div>
            <div class="status">🟢 System ready & loaded</div>
        </div>
        <button class="btn" id="attack-btn">🎯 TAP HERE TO ATTACK!</button>
        <button class="btn secondary" id="shop-btn">🛍️ OPEN FLAME SHOP — 50 🪙</button>
        <button class="btn secondary" id="online-btn">🌐 PLAY ONLINE</button>
        <button class="btn secondary" id="logout-btn">LOG OUT</button>
        <div id="console-log">&gt; Game initialized successfully...</div>
    </div>
</div>

<script>
"use strict";

window.addEventListener("DOMContentLoaded", () => {
    const STORAGE_KEY = "flame_assassin_accounts";
    const SESSION_KEY = "flame_assassin_session";

    let gameData = { username: "", score: 0, coins: 180, powerLevel: 1 };

    function getAccounts() {
        try {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : {};
        } catch (e) { return {}; }
    }

    function saveAccounts(accounts) {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts)); } catch (e) {}
    }

    function $(id) { return document.getElementById(id); }
    function show(el) { if (el) el.classList.remove("hidden"); }
    function hide(el) { if (el) el.classList.add("hidden"); }

    function setAuthMessage(msg) {
        const box = $("auth-message");
        if (box) box.textContent = msg;
    }

    function logMessage(msg) {
        const box = $("console-log");
        if (!box) return;
        const line = document.createElement("div");
        line.textContent = "> " + msg;
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
    }

    function updateGameUI() {
        if ($("player-name")) $("player-name").textContent = gameData.username;
        if ($("player-score")) $("player-score").textContent = "Score: " + gameData.score;
        if ($("player-coins")) $("player-coins").textContent = "Coins: " + gameData.coins + " 🪙";
        if ($("player-power")) $("player-power").textContent = "Power: Level " + gameData.powerLevel;
    }

    function signup() {
        const u = $("username").value.trim();
        const p = $("password").value;
        if (u.length < 3) { setAuthMessage("Username must be at least 3 chars."); return; }
        if (p.length < 4) { setAuthMessage("Password must be at least 4 chars."); return; }
        
        let accounts = getAccounts();
        if (accounts[u]) { setAuthMessage("Username already exists."); return; }

        accounts[u] = { password: p, score: 0, coins: 180, powerLevel: 1 };
        saveAccounts(accounts);
        localStorage.setItem(SESSION_KEY, u);
        startGame(u);
    }

    function login() {
        const u = $("username").value.trim();
        const p = $("password").value;
        let accounts = getAccounts();
        
        if (!accounts[u] || accounts[u].password !== p) {
            setAuthMessage("Invalid username or password.");
            return;
        }
        localStorage.setItem(SESSION_KEY, u);
        startGame(u);
    }

    function startGame(u) {
        let accounts = getAccounts();
        let acc = accounts[u] || { score: 0, coins: 180, powerLevel: 1 };
        gameData = { username: u, score: acc.score || 0, coins: acc.coins ?? 180, powerLevel: acc.powerLevel || 1 };

        hide($("auth-screen"));
        show($("game-screen"));
        updateGameUI();
        logMessage("Welcome back, " + u + "!");
    }

    function saveGame() {
        if (!gameData.username) return;
        let accounts = getAccounts();
        if (accounts[gameData.username]) {
            accounts[gameData.username].score = gameData.score;
            accounts[gameData.username].coins = gameData.coins;
            accounts[gameData.username].powerLevel = gameData.powerLevel;
            saveAccounts(accounts);
        }
    }

    function attack() {
        gameData.score += 1;
        gameData.coins += 10;
        updateGameUI();
        saveGame();
        logMessage("🔥 Attack successful! +10 coins.");
    }

    function openShop() {
        if (gameData.coins < 50) {
            logMessage("❌ Not enough coins (Need 50).");
            return;
        }
        gameData.coins -= 50;
        gameData.powerLevel += 1;
        updateGameUI();
        saveGame();
        logMessage("⚡ Power upgraded to Level " + gameData.powerLevel);
    }

    function playOnline() {
        logMessage("🌐 Online matchmaking requires backend.");
        alert("Real online multiplayer ke liye ek backend/WebSocket server ki zarurat hoti hai.");
    }

    function logout() {
        saveGame();
        localStorage.removeItem(SESSION_KEY);
        hide($("game-screen"));
        show($("auth-screen"));
        if ($("username")) $("username").value = "";
        if ($("password")) $("password").value = "";
        setAuthMessage("Logged out.");
    }

    if ($("signup-btn")) $("signup-btn").addEventListener("click", signup);
    if ($("login-btn")) $("login-btn").addEventListener("click", login);
    if ($("attack-btn")) $("attack-btn").addEventListener("click", attack);
    if ($("shop-btn")) $("shop-btn").addEventListener("click", openShop);
    if ($("online-btn")) $("online-btn").addEventListener("click", playOnline);
    if ($("logout-btn")) $("logout-btn").addEventListener("click", logout);

    const session = localStorage.getItem(SESSION_KEY);
    if (session) {
        let accounts = getAccounts();
        if (accounts[session]) startGame(session);
        else localStorage.removeItem(SESSION_KEY);
    }
});
</script>

</body>
</html>
